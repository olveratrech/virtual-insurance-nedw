spring.application.name=virtual-insurance-api

# La contrasena no tiene valor predeterminado y nunca se versiona.
spring.datasource.url=${VI_DB_URL:jdbc:oracle:thin:@//localhost:1522/etobda_s1.fi.unam}
spring.datasource.username=${VI_DB_USERNAME:VI_APP}
spring.datasource.password=${VI_DB_PASSWORD}

# Pool pequeno y con espera acotada para el entorno academico local.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# El esquema se administra con los scripts de database/, no con Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Contrato estricto y limites para el registro multipart.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# La cookie no es accesible desde JavaScript. Secure se habilitara al usar HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${VI_SESSION_COOKIE_SECURE:false}

# Solo se publica la salud general y no se revelan detalles del datasource.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Evita crear e imprimir el usuario temporal de Spring Security.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
